name: Build APK TV Home Web
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Giai nen src.zip
        run: |
          mkdir -p work
          unzip -q src.zip -d work
      - name: Build
        working-directory: work
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Doi ten APK
        run: cp work/app/build/outputs/apk/debug/app-debug.apk TVHomeWeb.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: web-${{ github.run_number }}
          name: TV Home Web ${{ github.run_number }}
          files: TVHomeWeb.apk
